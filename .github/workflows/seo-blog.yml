name: BetStorm SEO Blog - Calcio automatico

on:
  workflow_dispatch:
  schedule:
    # Martedì: 07:00 UTC in ora legale, 08:00 UTC in ora solare.
    - cron: '0 7 * * 2'
    - cron: '0 8 * * 2'

permissions:
  contents: write

concurrency:
  group: betstorm-calcio-settimanale
  cancel-in-progress: false

jobs:
  pubblica-calcio:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica martedì ore 09 italiane
        id: orario
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo('Europe/Rome'))
          # Consentiamo qualche ritardo del pianificatore GitHub.
          ok = os.environ['EVENT_NAME'] == 'workflow_dispatch' or (local.weekday() == 1 and 9 <= local.hour < 12)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'publish={str(ok).lower()}\n')
          print(f'Ora italiana: {local.isoformat()}; esegui: {ok}')
          PY

      - name: Genera articolo, indice e sitemap
        if: steps.orario.outputs.publish == 'true'
        run: python3 scripts/genera_blog.py

      - name: Pubblica su main
        if: steps.orario.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/*.html blog/articles-index.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'Nessuna modifica: articolo settimanale già pubblicato.'
            exit 0
          fi
          git commit -m 'Pubblica automaticamente blog calcio settimanale'
          git push origin HEAD:main
