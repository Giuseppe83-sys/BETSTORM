name: BetStorm SEO Blog - Calcio automatico

on:
  workflow_dispatch:
    inputs:
      aggiorna_oggi:
        description: 'Aggiorna articolo di oggi (richiede Champions ed Europa League accessibili)'
        required: true
        type: boolean
        default: false
  schedule:
    # Martedì 09:00 a Roma: 07 UTC in estate, 08 UTC in inverno.
    - cron: '0 7 * * 2'
    - cron: '0 8 * * 2'

permissions:
  contents: write

concurrency:
  group: betstorm-calcio-settimanale
  cancel-in-progress: false

jobs:
  pubblica-calcio:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica martedì ore 09 italiane
        id: orario
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo('Europe/Rome'))
          ok = os.environ['EVENT_NAME'] == 'workflow_dispatch' or (local.weekday() == 1 and 9 <= local.hour < 12)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'publish={str(ok).lower()}\n')
          print(f'Ora italiana: {local.isoformat()}; esegui: {ok}')
          PY

      - name: Genera o aggiorna articolo, indice e sitemap
        if: steps.orario.outputs.publish == 'true'
        env:
          AGGIORNA_OGGI: ${{ inputs.aggiorna_oggi || 'false' }}
        shell: bash
        run: |
          if [ "$AGGIORNA_OGGI" = 'true' ]; then
            echo 'Aggiornamento controllato: richiedo dati accessibili di Champions ed Europa League.'
            python3 scripts/genera_blog.py --refresh-today --require-cups
          else
            python3 scripts/genera_blog.py
          fi

      - name: Pubblica su main
        if: steps.orario.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/*.html blog/articles-index.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'Nessuna modifica: articolo settimanale già pubblicato.'
            exit 0
          fi
          git commit -m 'Pubblica automaticamente blog calcio settimanale'
          git push origin HEAD:main
