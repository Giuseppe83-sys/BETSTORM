<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BetStorm | Newsletter Admin</title><style>body{background:#071016;color:#eaf2f7;font:16px Arial,sans-serif;margin:0}main{max-width:850px;margin:40px auto;padding:20px}h1{color:#00e887}section{background:#101f29;padding:22px;border-radius:14px;margin:20px 0}label{display:block;margin:14px 0 6px}input,textarea{box-sizing:border-box;width:100%;background:#071016;color:white;border:1px solid #456;padding:13px;border-radius:8px;font:inherit}textarea{min-height:240px}button{background:#00e887;color:#071016;border:0;border-radius:8px;padding:13px 20px;font-weight:bold;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.4;cursor:not-allowed}#preview{background:white;color:#17212b;padding:22px;border-radius:10px;white-space:pre-wrap;line-height:1.6}#status{white-space:pre-wrap}a{color:#00e887}</style></head><body><main><h1>⚡ BetStorm — Newsletter Admin</h1><p><a href="/">← Torna a BetStorm</a> · Accesso riservato</p><section><h2>Stato</h2><p id="status">Verifica accesso in corso…</p><button id="reload" disabled>Verifica destinatari</button></section><section><h2>Componi newsletter</h2><label for="subject">Oggetto</label><input id="subject" maxlength="180" placeholder="BetStorm — Aggiornamento sportivo"><label for="message">Messaggio (testo semplice)</label><textarea id="message" maxlength="12000" placeholder="Scrivi qui il testo della newsletter..."></textarea><button id="previewBtn" disabled>Mostra anteprima</button><div id="preview" hidden></div><p>Il link personale di disiscrizione sarà aggiunto automaticamente a ogni email.</p><label><input type="checkbox" id="approval" style="width:auto"> Ho verificato testo, destinatari e anteprima; autorizzo l'invio.</label><button id="send" disabled>Invia newsletter</button></section></main><script>
const $=id=>document.getElementById(id);let token='';let count=0;let sending=false;
function status(s){$('status').textContent=s}
async function validToken(){const raw=localStorage.getItem('betstorm_session');if(!raw)throw Error('Accedi prima a BetStorm.');const s=JSON.parse(raw);if(!s.access_token)throw Error('Sessione mancante: accedi di nuovo a BetStorm.');return s.access_token}
async function api(action,payload){const r=await fetch('/api/newsletter-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...payload})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Errore HTTP '+r.status);return data}
async function load(){try{token=await validToken();const d=await api('status');count=d.count;status('Accesso amministratore verificato. Destinatari attivi: '+count);$('reload').disabled=false;$('previewBtn').disabled=false;$('send').disabled=false}catch(e){status('Accesso non disponibile: '+e.message);$('send').disabled=true}}
$('reload').onclick=load;
$('previewBtn').onclick=()=>{const subj=$('subject').value.trim(),msg=$('message').value.trim();if(!subj||!msg)return status('Inserisci oggetto e messaggio.');$('preview').textContent='OGGETTO: '+subj+'\n\n'+msg+'\n\n— BetStorm · 18+\nDisiscriviti: [link personale aggiunto in invio]';$('preview').hidden=false};
$('send').onclick=async()=>{if(sending)return;const subject=$('subject').value.trim(),message=$('message').value.trim();if(!subject||!message||!$('approval').checked||!(!$('preview').hidden))return status('Compila i campi, mostra anteprima e conferma la verifica.');if(!confirm('Inviare questa newsletter a '+count+' iscritti attivi? Questa azione non è annullabile.'))return;sending=true;$('send').disabled=true;try{const id=crypto.randomUUID();const d=await api('send',{campaignId:id,subject,message});status('Invio completato. Inviate: '+d.sent+'; errori: '+d.failed+'. Campagna: '+id+'. Eventuali errori restano bloccati per evitare duplicati.');$('approval').checked=false;$('preview').hidden=true}catch(e){status('Invio non completato: '+e.message+' (non ripetere immediatamente: controlla i log Vercel).')}finally{sending=false;$('send').disabled=false}};
$('subject').addEventListener('input',()=>{$('preview').hidden=true;$('approval').checked=false});$('message').addEventListener('input',()=>{$('preview').hidden=true;$('approval').checked=false});load();
</script></body></html>
